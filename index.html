<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>0 à 1000 - Le Jeu Web</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel pour compiler le JSX dans le navigateur -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- qrcodejs officiel pour un QR code 100% lisible sur smartphone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Import de la police Cartoon Fredoka pour les chiffres dynamiques -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Fredoka', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- COMPOSANT QR CODE AVEC LA LIBRAIRIE OFFICIELLE ---
    const QRCodeCanvas = ({ value, size = 180 }) => {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;
        containerRef.current.innerHTML = "";
        
        new QRCode(containerRef.current, {
          text: value || window.location.href,
          width: size,
          height: size,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }, [value, size]);

      return (
        <div className="p-3 bg-white rounded-2xl shadow-2xl inline-block border-4 border-amber-400">
          <div ref={containerRef} className="block" />
        </div>
      );
    };

    // --- SYNTHÉTISEUR AUDIO NATIVE ---
    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        }
      } catch (e) {}
    };

    // BANQUE DE QUESTIONS
    const QUESTIONS_DATABASE = [
      { text: "La hauteur de la Tour Eiffel (en mètres)", value: 330 },
      { text: "Le nombre de pages dans un roman moyen", value: 350 },
      { text: "Le record du monde de vitesse à vélo (en km/h)", value: 334 },
      { text: "La température d'ébullition du Mercure (°C)", value: 357 },
      { text: "Nombre de marches de la Tour de Pise", value: 294 },
      { text: "Le nombre moyen de graines sur une fraise", value: 200 },
      { text: "Nombre d'épisodes de la série Friends", value: 236 },
      { text: "Nombre de jours d'incubation d'un œuf d'autruche", value: 42 },
      { text: "Vitesse maximale d'un TGV en service (km/h)", value: 320 },
      { text: "Nombre de kilomètres d'un marathon x 10", value: 422 },
      { text: "Altitude du sommet du Mont Blanc (/ 10 m)", value: 480 },
      { text: "Nombre de pièces d'un puzzle géant standard", value: 500 }
    ];

    function App() {
      const [viewMode, setViewMode] = useState('tv');
      const [activeTeamId, setActiveTeamId] = useState(1);
      const [appUrl, setAppUrl] = useState('');
      const [targetValue, setTargetValue] = useState(500);
      const [deck, setDeck] = useState([]);
      const [phase, setPhase] = useState('lobby'); // 'lobby', 'selection', 'revealed', 'animating'
      const [roundResults, setRoundResults] = useState(null);
      const [selectedPowerForInfo, setSelectedPowerForInfo] = useState(null);
      const [powerToConfirm, setPowerToConfirm] = useState(null);

      const [teams, setTeams] = useState([
        {
          id: 1, name: "Équipe Bleue", color: "bg-blue-600", borderColor: "border-blue-500", textColor: "text-blue-400", hand: [],
          powers: [
            { id: 'p200', name: '+200 / -200', desc: 'Ajoute ou soustrait 200 à votre carte.', used: false },
            { id: 'change', name: 'Changer', desc: 'Défausse une carte et en pioche une nouvelle.', used: false },
            { id: 'double', name: 'Double Carte', desc: 'Jouez 2 cartes simultanément.', used: false }
          ], selectedCard: null, activePowerEffect: null
        },
        {
          id: 2, name: "Équipe Rouge", color: "bg-red-600", borderColor: "border-red-500", textColor: "text-red-400", hand: [],
          powers: [
            { id: 'p200', name: '+200 / -200', desc: 'Ajoute ou soustrait 200 à votre carte.', used: false },
            { id: 'change', name: 'Changer', desc: 'Défausse une carte et en pioche une nouvelle.', used: false },
            { id: 'double', name: 'Double Carte', desc: 'Jouez 2 cartes simultanément.', used: false }
          ], selectedCard: null, activePowerEffect: null
        }
      ]);

      useEffect(() => {
        setAppUrl(window.location.href);
        initGame();
      }, []);

      const initGame = () => {
        const shuffled = [...QUESTIONS_DATABASE].sort(() => Math.random() - 0.5);
        setDeck(shuffled.slice(12));
        setTargetValue(500);
        setPhase('lobby');
        setRoundResults(null);
        setTeams(prev => [
          { ...prev[0], hand: shuffled.slice(0, 6), selectedCard: null, activePowerEffect: null, powers: prev[0].powers.map(p => ({ ...p, used: false })) },
          { ...prev[1], hand: shuffled.slice(6, 12), selectedCard: null, activePowerEffect: null, powers: prev[1].powers.map(p => ({ ...p, used: false })) }
        ]);
      };

      const startGame = () => {
        setPhase('selection');
      };

      const handleSelectCard = (teamId, card) => {
        setTeams(prev => prev.map(t => t.id === teamId ? { ...t, selectedCard: card } : t));
      };

      const triggerReveal = () => {
        if (!teams[0].selectedCard || !teams[1].selectedCard) return;
        setPhase('revealed');

        const calcValue = (team) => {
          let val = team.selectedCard.value;
          if (team.activePowerEffect === 'plus200') val += 200;
          if (team.activePowerEffect === 'minus200') val -= 200;
          return val;
        };

        const val1 = calcValue(teams[0]);
        const val2 = calcValue(teams[1]);
        const diff1 = Math.abs(val1 - targetValue);
        const diff2 = Math.abs(val2 - targetValue);

        const winnerId = diff1 <= diff2 ? 1 : 2;
        const loserId = winnerId === 1 ? 2 : 1;

        // Pause de 2 secondes avant l'animation
        setTimeout(() => {
          setPhase('animating');
          playSound('success');
          setRoundResults({ val1, val2, winnerId, loserId });

          // La carte la plus éloignée devient la nouvelle cible
          setTimeout(() => {
            const loserValue = loserId === 1 ? val1 : val2;
            setTargetValue(loserValue);

            setTeams(prev => prev.map(t => {
              let newHand = t.hand.filter(c => c.text !== t.selectedCard.text);
              if (t.id === loserId && deck.length > 0) {
                newHand.push(deck[0]);
                setDeck(d => d.slice(1));
              }
              return { ...t, hand: newHand, selectedCard: null, activePowerEffect: null };
            }));

            setPhase('selection');
            setRoundResults(null);
          }, 3500);

        }, 2000);
      };

      const confirmUsePower = () => {
        if (!powerToConfirm) return;
        const { teamId, powerId, option } = powerToConfirm;

        setTeams(prev => prev.map(t => {
          if (t.id !== teamId) return t;
          const updatedPowers = t.powers.map(p => p.id === powerId ? { ...p, used: true } : p);
          if (powerId === 'change' && t.hand.length > 0 && deck.length > 0) {
            return { ...t, powers: updatedPowers, hand: [...t.hand.slice(1), deck[0]] };
          }
          return { ...t, powers: updatedPowers, activePowerEffect: option || true };
        }));

        setPowerToConfirm(null);
      };

      return (
        <div className="w-screen h-screen relative bg-slate-950 text-slate-100 flex flex-col justify-between">
          
          {/* FOND DE SCÈNE AFFINITY DESIGNER */}
          <img 
            src="assets/Fond.svg"
            alt="Fond Plateau" 
            className="absolute inset-0 w-full h-full object-cover z-0"
          />

          {/* BARRE DU HAUT : SEULEMENT visible au survol ou pour commuter TV/MOBILE */}
          <header className="relative z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/50 p-2 flex justify-between items-center opacity-40 hover:opacity-100 transition">
            <span className="text-lg font-black text-amber-400">0 À 1000</span>
            <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
              <button onClick={() => setViewMode('tv')} className={`px-3 py-1 rounded-lg text-xs font-medium ${viewMode === 'tv' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>TV Hôte</button>
              <button onClick={() => setViewMode('mobile')} className={`px-3 py-1 rounded-lg text-xs font-medium ${viewMode === 'mobile' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Smartphone</button>
            </div>
            <button onClick={initGame} title="Réinitialiser" className="p-1.5 bg-slate-800 text-slate-300 rounded-lg">🔄</button>
          </header>

          {/* ========================================================= */}
          {/* VUE ÉCRAN TV (HABILLAGE VECTORIEL AFFINITY DESIGNER 2) */}
          {/* ========================================================= */}
          {viewMode === 'tv' && (
            <main className="relative z-10 flex-1 flex flex-col justify-between p-6">
              
              {/* EN-TÊTE ÉQUIPES : BANNIÈRES + COMPTEURS + POUVOIRS */}
              <div className="grid grid-cols-2 gap-12 px-6">
                
                {/* ÉQUIPE BLEUE */}
                <div className="flex flex-col items-start gap-2">
                  <div className="relative w-64 h-14 flex items-center justify-center">
                    <img src="assets/nom bleu.svg" className="absolute inset-0 w-full h-full object-contain" />
                    <span className="relative z-10 font-black text-xl text-white drop-shadow">{teams[0].name}</span>
                  </div>
                  
                  <div className="flex items-center gap-4">
                    <div className="relative w-40 h-10 flex items-center justify-center">
                      <img src="assets/info cartes.svg" className="absolute inset-0 w-full h-full object-contain" />
                      <span className="relative z-10 font-bold text-sm text-slate-900">{teams[0].hand.length} cartes</span>
                    </div>
                    
                    {/* CARTE POUVOIR INTEGRÉE */}
                    <img 
                      src="assets/Pouvoir.svg" 
                      className={`h-12 object-contain transition ${teams[0].powers.every(p => p.used) ? 'opacity-30 grayscale' : ''}`} 
                    />
                  </div>
                </div>

                {/* ÉQUIPE ROUGE */}
                <div className="flex flex-col items-end gap-2">
                  <div className="relative w-64 h-14 flex items-center justify-center">
                    <img src="assets/nom rouge.svg" className="absolute inset-0 w-full h-full object-contain" />
                    <span className="relative z-10 font-black text-xl text-white drop-shadow">{teams[1].name}</span>
                  </div>
                  
                  <div className="flex items-center gap-4">
                    <img 
                      src="assets/Pouvoir.svg" 
                      className={`h-12 object-contain transition ${teams[1].powers.every(p => p.used) ? 'opacity-30 grayscale' : ''}`} 
                    />

                    <div className="relative w-40 h-10 flex items-center justify-center">
                      <img src="assets/info cartes.svg" className="absolute inset-0 w-full h-full object-contain" />
                      <span className="relative z-10 font-bold text-sm text-slate-900">{teams[1].hand.length} cartes</span>
                    </div>
                  </div>
                </div>

              </div>

              {/* CENTRE DU PLATEAU TV : LOBBY QR CODE OU CARTE CIBLE AFFINITY */}
              <div className="flex items-center justify-center my-auto relative">
                
                {phase === 'lobby' ? (
                  /* PHASE LOBBY : QR CODE SUR LA TV AU DÉMARRAGE */
                  <div className="flex flex-col items-center gap-4 bg-slate-900/90 backdrop-blur-md p-6 rounded-3xl border-4 border-amber-400 shadow-2xl z-30">
                    <h2 className="text-xl font-black text-amber-400">CONNEXION SMARTPHONES</h2>
                    <QRCodeCanvas value={appUrl} size={190} />
                    <button 
                      onClick={startGame}
                      className="mt-2 py-3 px-8 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-amber-950 font-black text-lg rounded-xl shadow-xl transition transform active:scale-95"
                    >
                      LANCER LA PARTIE ▶
                    </button>
                  </div>
                ) : (
                  /* PHASE DE JEU : CARTE CIBLE VECTORIELLE AFFINITY (SANS QR CODE) */
                  <div className="flex flex-col items-center gap-4">
                    <div className="relative w-96 h-60 flex items-center justify-center drop-shadow-2xl">
                      <img src="assets/cartes cible.svg" className="absolute inset-0 w-full h-full object-contain" />
                      {/* Chiffre de la Cible surimposé au centre */}
                      <span className="relative z-10 text-8xl font-black text-white drop-shadow-[0_8px_0_rgba(0,0,0,0.8)]">
                        {targetValue}
                      </span>
                    </div>

                    {/* Bouton pour déclencher la révélation */}
                    {phase === 'selection' && teams[0].selectedCard && teams[1].selectedCard && (
                      <button 
                        onClick={triggerReveal} 
                        className="py-3 px-8 bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-xl rounded-2xl shadow-2xl border-2 border-amber-200 transform active:scale-95 transition"
                      >
                        RÉVÉLER LES CARTES !
                      </button>
                    )}
                  </div>
                )}

              </div>

              {/* ZONE DU BAS : PLACEMENT ET RÉVÉLATION DES CARTES D'ÉQUIPES */}
              <div className="grid grid-cols-2 gap-12 px-6">
                
                {/* CARTE ÉQUIPE BLEUE */}
                <div className="flex flex-col items-center">
                  <div className={`relative w-80 h-44 flex items-center justify-center transition-all duration-700 ${
                    phase === 'animating' && roundResults?.winnerId === 1 ? 'scale-110' : ''
                  } ${
                    phase === 'animating' && roundResults?.loserId === 1 ? 'scale-90 opacity-80' : ''
                  }`}>
                    <img src="assets/Partie bleu.svg" className="absolute inset-0 w-full h-full object-contain" />
                    
                    {teams[0].selectedCard ? (
                      <div className="relative z-10 p-4 text-center">
                        <p className="text-xs text-slate-800 font-bold mb-2">{teams[0].selectedCard.text}</p>
                        <div className="text-4xl font-black text-blue-900">
                          {phase === 'selection' ? '❓' : teams[0].selectedCard.value}
                        </div>
                      </div>
                    ) : (
                      <span className="relative z-10 text-xs text-slate-500 font-bold">En attente...</span>
                    )}

                    {/* COCHE VERTE SUR LA PLUS PROCHE */}
                    {phase === 'animating' && roundResults?.winnerId === 1 && (
                      <img src="assets/vrai.svg" className="absolute z-30 w-24 h-24 drop-shadow-xl animate-in zoom-in-50" />
                    )}
                    {/* CROIX ROUGE SUR LA PLUS ÉLOIGNÉE */}
                    {phase === 'animating' && roundResults?.loserId === 1 && (
                      <img src="assets/Faux.svg" className="absolute z-30 w-24 h-24 drop-shadow-xl animate-in zoom-in-50" />
                    )}
                  </div>
                </div>

                {/* CARTE ÉQUIPE ROUGE */}
                <div className="flex flex-col items-center">
                  <div className={`relative w-80 h-44 flex items-center justify-center transition-all duration-700 ${
                    phase === 'animating' && roundResults?.winnerId === 2 ? 'scale-110' : ''
                  } ${
                    phase === 'animating' && roundResults?.loserId === 2 ? 'scale-90 opacity-80' : ''
                  }`}>
                    <img src="assets/Partie Rouge.svg" className="absolute inset-0 w-full h-full object-contain" />
                    
                    {teams[1].selectedCard ? (
                      <div className="relative z-10 p-4 text-center">
                        <p className="text-xs text-slate-800 font-bold mb-2">{teams[1].selectedCard.text}</p>
                        <div className="text-4xl font-black text-red-900">
                          {phase === 'selection' ? '❓' : teams[1].selectedCard.value}
                        </div>
                      </div>
                    ) : (
                      <span className="relative z-10 text-xs text-slate-500 font-bold">En attente...</span>
                    )}

                    {/* COCHE VERTE SUR LA PLUS PROCHE */}
                    {phase === 'animating' && roundResults?.winnerId === 2 && (
                      <img src="assets/vrai.svg" className="absolute z-30 w-24 h-24 drop-shadow-xl animate-in zoom-in-50" />
                    )}
                    {/* CROIX ROUGE SUR LA PLUS ÉLOIGNÉE */}
                    {phase === 'animating' && roundResults?.loserId === 2 && (
                      <img src="assets/Faux.svg" className="absolute z-30 w-24 h-24 drop-shadow-xl animate-in zoom-in-50" />
                    )}
                  </div>
                </div>

              </div>

            </main>
          )}

          {/* ========================================================= */}
          {/* VUE SMARTPHONE (MANETTE DE JEU MOBILE) */}
          {/* ========================================================= */}
          {viewMode === 'mobile' && (
            <main className="relative z-10 flex-1 flex flex-col p-4 max-w-md mx-auto w-full justify-between">
              
              <div className="flex bg-slate-900/90 p-1.5 rounded-xl border border-slate-800 shadow-xl">
                {teams.map(t => (
                  <button key={t.id} onClick={() => setActiveTeamId(t.id)} className={`flex-1 py-2 text-xs font-bold rounded-lg ${activeTeamId === t.id ? `${t.color} text-white` : 'text-slate-400'}`}>
                    {t.name}
                  </button>
                ))}
              </div>

              {(() => {
                const t = teams.find(team => team.id === activeTeamId);
                if (!t) return null;
                return (
                  <div className="flex-1 flex flex-col justify-between my-4 gap-4">
                    <div className="grid grid-cols-2 gap-3">
                      {t.hand.map((card, idx) => {
                        const isSelected = t.selectedCard?.text === card.text;
                        return (
                          <div key={idx} onClick={() => handleSelectCard(t.id, card)} className={`p-3 rounded-2xl border-2 h-28 flex flex-col justify-between cursor-pointer transition ${isSelected ? 'bg-amber-400 border-white text-slate-950 font-bold shadow-lg scale-105' : 'bg-slate-900/90 border-slate-700 text-slate-200'}`}>
                            <p className="text-xs">{card.text}</p>
                            {isSelected && <span className="text-right text-xs font-black">Sélectionnée ✓</span>}
                          </div>
                        );
                      })}
                    </div>

                    <div className="grid grid-cols-3 gap-2">
                      {t.powers.map(p => (
                        <div key={p.id} className="flex flex-col gap-1">
                          <div onClick={() => setSelectedPowerForInfo(p)} className={`p-2 rounded-xl border h-20 flex flex-col justify-between cursor-pointer ${p.used ? 'bg-slate-900 border-slate-800 text-slate-600 opacity-40' : 'bg-amber-400 text-amber-950 border-amber-300 font-bold'}`}>
                            <span className="text-[10px] uppercase">Pouvoir</span>
                            <span className="text-xs leading-tight">{p.name}</span>
                          </div>
                          <button disabled={p.used} onClick={() => setPowerToConfirm({ teamId: t.id, powerId: p.id })} className={`py-1 text-[11px] font-bold rounded-lg ${p.used ? 'bg-slate-900 text-slate-600' : 'bg-indigo-600 text-white'}`}>
                            {p.used ? 'Utilisé' : 'Utiliser'}
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })()}
            </main>
          )}

          {/* MODALE D'INFORMATIONS DU POUVOIR */}
          {selectedPowerForInfo && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full">
                <h3 className="text-lg font-bold text-amber-400 mb-2">{selectedPowerForInfo.name}</h3>
                <p className="text-sm text-slate-300 mb-6">{selectedPowerForInfo.desc}</p>
                <button onClick={() => setSelectedPowerForInfo(null)} className="w-full py-2 bg-slate-800 text-white font-bold rounded-xl">Fermer</button>
              </div>
            </div>
          )}

          {/* MODALE DE CONFIRMATION DE POUVOIR */}
          {powerToConfirm && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full">
                <h3 className="text-lg font-bold text-white mb-2">Confirmer le pouvoir ?</h3>
                {powerToConfirm.powerId === 'p200' && (
                  <div className="grid grid-cols-2 gap-2 mb-4">
                    <button onClick={() => setPowerToConfirm(prev => ({ ...prev, option: 'plus200' }))} className={`py-2 text-xs font-bold rounded-lg border ${powerToConfirm.option === 'plus200' ? 'bg-amber-400 text-amber-950' : 'bg-slate-800 text-slate-300'}`}>+200</button>
                    <button onClick={() => setPowerToConfirm(prev => ({ ...prev, option: 'minus200' }))} className={`py-2 text-xs font-bold rounded-lg border ${powerToConfirm.option === 'minus200' ? 'bg-amber-400 text-amber-950' : 'bg-slate-800 text-slate-300'}`}>-200</button>
                  </div>
                )}
                <div className="flex gap-2">
                  <button onClick={() => setPowerToConfirm(null)} className="flex-1 py-2 bg-slate-800 text-slate-300 font-bold rounded-xl">Annuler</button>
                  <button onClick={confirmUsePower} className="flex-1 py-2 bg-indigo-600 text-white font-bold rounded-xl">Valider</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
