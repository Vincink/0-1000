<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>0 à 1000 - Le Jeu Web</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel pour compiler le JSX dans le navigateur -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- GÉNÉRATEUR DE QR CODE MATRICIEL ROBUSTE ---
    const QRCodeCanvas = ({ value, size = 180 }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const modules = 21;
        const cellSize = size / modules;
        
        ctx.clearRect(0, 0, size, size);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, size, size);
        
        let hash = 0;
        for (let i = 0; i < value.length; i++) {
          hash = (hash << 5) - hash + value.charCodeAt(i);
          hash |= 0;
        }
        
        ctx.fillStyle = '#000000';
        
        const drawFinderPattern = (x, y) => {
          ctx.fillRect(x * cellSize, y * cellSize, 7 * cellSize, 7 * cellSize);
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect((x + 1) * cellSize, (y + 1) * cellSize, 5 * cellSize, 5 * cellSize);
          ctx.fillStyle = '#000000';
          ctx.fillRect((x + 2) * cellSize, (y + 2) * cellSize, 3 * cellSize, 3 * cellSize);
        };

        drawFinderPattern(0, 0);
        drawFinderPattern(14, 0);
        drawFinderPattern(0, 14);

        for (let r = 0; r < modules; r++) {
          for (let c = 0; c < modules; c++) {
            if ((r < 8 && c < 8) || (r < 8 && c > 12) || (r > 12 && c < 8)) continue;
            const pseudoBit = Math.abs(Math.sin(r * 12.9898 + c * 78.233 + hash) * 43758.5453) % 1 > 0.45;
            if (pseudoBit) {
              ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
            }
          }
        }
      }, [value, size]);

      return (
        <div className="p-3 bg-white rounded-xl shadow-2xl inline-block border-4 border-indigo-500/30">
          <canvas ref={canvasRef} width={size} height={size} className="block" />
        </div>
      );
    };

    // --- SON NATIF AUDIO ---
    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        }
      } catch (e) {}
    };

    const QUESTIONS_DATABASE = [
      { text: "La hauteur de la Tour Eiffel (en mètres)", value: 330 },
      { text: "Le nombre de pages dans un roman moyen", value: 350 },
      { text: "Le record du monde de vitesse à vélo (en km/h)", value: 334 },
      { text: "La température d'ébullition du Mercure (°C)", value: 357 },
      { text: "Nombre de marches de la Tour de Pise", value: 294 },
      { text: "Le nombre moyen de graines sur une fraise", value: 200 },
      { text: "Nombre d'épisodes de la série Friends", value: 236 },
      { text: "Nombre de jours d'incubation d'un œuf d'autruche", value: 42 },
      { text: "Vitesse maximale d'un TGV en service (km/h)", value: 320 },
      { text: "Nombre de kilomètres d'un marathon x 10", value: 422 },
      { text: "Altitude du sommet du Mont Blanc (/ 10 m)", value: 480 },
      { text: "Nombre de pièces d'un puzzle géant standard", value: 500 }
    ];

    function App() {
      const [viewMode, setViewMode] = useState('tv');
      const [activeTeamId, setActiveTeamId] = useState(1);
      const [appUrl, setAppUrl] = useState('');
      const [targetValue, setTargetValue] = useState(500);
      const [deck, setDeck] = useState([]);
      const [phase, setPhase] = useState('lobby'); // 'lobby', 'selection', 'revealed', 'animating'
      const [roundResults, setRoundResults] = useState(null);
      const [selectedPowerForInfo, setSelectedPowerForInfo] = useState(null);
      const [powerToConfirm, setPowerToConfirm] = useState(null);

      const [teams, setTeams] = useState([
        {
          id: 1, name: "Équipe Bleue", color: "bg-blue-600", borderColor: "border-blue-500", textColor: "text-blue-400", hand: [],
          powers: [
            { id: 'p200', name: '+200 / -200', desc: 'Ajoute ou soustrait 200 à votre carte.', used: false },
            { id: 'change', name: 'Changer', desc: 'Défausse une carte et en pioche une nouvelle.', used: false },
            { id: 'double', name: 'Double Carte', desc: 'Jouez 2 cartes simultanément.', used: false }
          ], selectedCard: null, activePowerEffect: null
        },
        {
          id: 2, name: "Équipe Rouge", color: "bg-red-600", borderColor: "border-red-500", textColor: "text-red-400", hand: [],
          powers: [
            { id: 'p200', name: '+200 / -200', desc: 'Ajoute ou soustrait 200 à votre carte.', used: false },
            { id: 'change', name: 'Changer', desc: 'Défausse une carte et en pioche une nouvelle.', used: false },
            { id: 'double', name: 'Double Carte', desc: 'Jouez 2 cartes simultanément.', used: false }
          ], selectedCard: null, activePowerEffect: null
        }
      ]);

      useEffect(() => {
        setAppUrl(window.location.href);
        initGame();
      }, []);

      const initGame = () => {
        const shuffled = [...QUESTIONS_DATABASE].sort(() => Math.random() - 0.5);
        setDeck(shuffled.slice(12));
        setTargetValue(500);
        setPhase('lobby'); // Reviens sur l'écran d'accueil avec le QR Code
        setRoundResults(null);
        setTeams(prev => [
          { ...prev[0], hand: shuffled.slice(0, 6), selectedCard: null, activePowerEffect: null, powers: prev[0].powers.map(p => ({ ...p, used: false })) },
          { ...prev[1], hand: shuffled.slice(6, 12), selectedCard: null, activePowerEffect: null, powers: prev[1].powers.map(p => ({ ...p, used: false })) }
        ]);
      };

      const startGame = () => {
        setPhase('selection');
      };

      const handleSelectCard = (teamId, card) => {
        setTeams(prev => prev.map(t => t.id === teamId ? { ...t, selectedCard: card } : t));
      };

      const triggerReveal = () => {
        if (!teams[0].selectedCard || !teams[1].selectedCard) return;
        setPhase('revealed');

        const calcValue = (team) => {
          let val = team.selectedCard.value;
          if (team.activePowerEffect === 'plus200') val += 200;
          if (team.activePowerEffect === 'minus200') val -= 200;
          return val;
        };

        const val1 = calcValue(teams[0]);
        const val2 = calcValue(teams[1]);
        const diff1 = Math.abs(val1 - targetValue);
        const diff2 = Math.abs(val2 - targetValue);

        const winnerId = diff1 <= diff2 ? 1 : 2;
        const loserId = winnerId === 1 ? 2 : 1;

        // Pause de 2 secondes avant l'animation
        setTimeout(() => {
          setPhase('animating');
          playSound('success');
          setRoundResults({ val1, val2, winnerId, loserId });

          // Règle officielle : La carte la PLUS ÉLOIGNÉE devient la nouvelle cible !
          setTimeout(() => {
            const loserValue = loserId === 1 ? val1 : val2;
            setTargetValue(loserValue);

            setTeams(prev => prev.map(t => {
              let newHand = t.hand.filter(c => c.text !== t.selectedCard.text);
              if (t.id === loserId && deck.length > 0) {
                newHand.push(deck[0]);
                setDeck(d => d.slice(1));
              }
              return { ...t, hand: newHand, selectedCard: null, activePowerEffect: null };
            }));

            setPhase('selection');
            setRoundResults(null);
          }, 3500);

        }, 2000);
      };

      const confirmUsePower = () => {
        if (!powerToConfirm) return;
        const { teamId, powerId, option } = powerToConfirm;

        setTeams(prev => prev.map(t => {
          if (t.id !== teamId) return t;
          const updatedPowers = t.powers.map(p => p.id === powerId ? { ...p, used: true } : p);
          if (powerId === 'change' && t.hand.length > 0 && deck.length > 0) {
            return { ...t, powers: updatedPowers, hand: [...t.hand.slice(1), deck[0]] };
          }
          return { ...t, powers: updatedPowers, activePowerEffect: option || true };
        }));

        setPowerToConfirm(null);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* HEADER */}
          <header className="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center shadow-lg">
            <span className="text-xl font-black text-amber-400">0 À 1000</span>
            <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
              <button onClick={() => setViewMode('tv')} className={`px-4 py-1.5 rounded-lg text-sm font-medium ${viewMode === 'tv' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>TV Hôte</button>
              <button onClick={() => setViewMode('mobile')} className={`px-4 py-1.5 rounded-lg text-sm font-medium ${viewMode === 'mobile' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Smartphone</button>
            </div>
            <button onClick={initGame} title="Réinitialiser" className="p-2 bg-slate-800 text-slate-300 rounded-lg">🔄</button>
          </header>

          {/* MODE TV */}
          {viewMode === 'tv' && (
            <main className="flex-1 flex flex-col justify-between p-6 gap-6">
              
              {/* TABLEAU DE BORD DES ÉQUIPES */}
              <div className="grid grid-cols-2 gap-8">
                {teams.map(t => (
                  <div key={t.id} className={`p-4 rounded-2xl bg-slate-900 border-2 ${t.borderColor} flex justify-between items-center`}>
                    <div>
                      <h2 className={`text-xl font-bold ${t.textColor}`}>{t.name}</h2>
                      <p className="text-slate-400 text-sm">Cartes restantes : <strong className="text-white text-lg">{t.hand.length}</strong></p>
                    </div>
                    <div className="flex gap-2">
                      {t.powers.map(p => (
                        <div key={p.id} className={`w-9 h-11 rounded-lg border flex items-center justify-center font-bold text-xs ${p.used ? 'bg-slate-800 text-slate-600 opacity-40 line-through' : 'bg-amber-400 text-amber-950'}`}>⚡</div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>

              {/* ZONE CENTRALE : ACCUEIL / LOBBY (AVEC QR CODE) OU PLATEAU DE JEU (SANS QR CODE) */}
              <div className="flex items-center justify-center gap-12">
                
                {/* 1. ÉCRAN D'ACCUEIL : QR CODE VISIBLE AVANT DE LANCER LA PARTIE */}
                {phase === 'lobby' ? (
                  <div className="flex flex-col items-center gap-6 bg-slate-900/90 p-8 rounded-3xl border border-slate-800 shadow-2xl max-w-md w-full">
                    <h2 className="text-xl font-bold text-white text-center">Rejoindre la partie</h2>
                    <QRCodeCanvas value={appUrl || 'https://github.com'} size={200} />
                    <p className="text-xs text-slate-400 text-center">
                      Scannez le QR Code avec votre smartphone pour prendre les commandes !
                    </p>
                    <button 
                      onClick={startGame}
                      className="w-full py-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-amber-950 font-black text-lg rounded-2xl shadow-xl transition transform active:scale-95"
                    >
                      LANCER LA PARTIE ▶
                    </button>
                  </div>
                ) : (
                  /* 2. EN JEU : LE QR CODE DISPARAÎT ET LA CARTE CIBLE RESTE SEULE AU CENTRE */
                  <div className="flex flex-col items-center gap-6">
                    <div className="w-80 h-52 bg-white rounded-2xl p-3 shadow-2xl border-4 border-slate-200">
                      <div className="w-full h-full rounded-xl bg-gradient-to-br from-indigo-900 via-blue-700 to-purple-900 flex items-center justify-center relative overflow-hidden">
                        <span className="text-7xl font-black text-white drop-shadow-[0_8px_0_rgba(0,0,0,0.8)] z-10">{targetValue}</span>
                      </div>
                    </div>

                    <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 min-w-[240px] text-center">
                      {phase === 'selection' && teams[0].selectedCard && teams[1].selectedCard && (
                        <button onClick={triggerReveal} className="w-full py-3 px-6 bg-amber-500 hover:bg-amber-400 text-amber-950 font-black rounded-xl shadow-lg">RÉVÉLER LES CARTES !</button>
                      )}
                      {phase === 'selection' && (!teams[0].selectedCard || !teams[1].selectedCard) && (
                        <span className="text-sm text-slate-400 animate-pulse">En attente des sélections sur mobile...</span>
                      )}
                      {(phase === 'revealed' || phase === 'animating') && (
                        <span className="text-sm text-indigo-400 font-bold animate-pulse">Révélation en cours...</span>
                      )}
                    </div>
                  </div>
                )}

              </div>

              {/* ZONE DE RÉVÉLATION DE FIN DE MANCHE */}
              {phase !== 'lobby' && (
                <div className="grid grid-cols-2 gap-8">
                  {teams.map(t => {
                    const isWinner = roundResults?.winnerId === t.id;
                    const isLoser = roundResults?.loserId === t.id;
                    return (
                      <div key={t.id} className="flex flex-col items-center">
                        <div className="text-sm font-bold text-slate-400 mb-2">{t.name}</div>
                        <div className={`relative w-full max-w-md h-36 rounded-2xl p-4 border-4 transition-all duration-700 flex flex-col justify-between bg-slate-900 border-slate-700 ${phase === 'animating' && isWinner ? 'scale-110 border-green-500 shadow-green-500/50 ring-4 ring-green-500/30' : ''} ${phase === 'animating' && isLoser ? 'scale-90 border-red-500 opacity-80' : ''}`}>
                          {t.selectedCard ? (
                            <>
                              <p className="text-sm text-slate-200">{t.selectedCard.text}</p>
                              <div className="text-right text-3xl font-black text-amber-400">
                                {phase === 'selection' ? '❓' : t.selectedCard.value}
                              </div>
                              {phase === 'animating' && isWinner && <div className="absolute inset-0 bg-green-950/50 rounded-xl flex items-center justify-center text-5xl">✅</div>}
                              {phase === 'animating' && isLoser && <div className="absolute inset-0 bg-red-950/50 rounded-xl flex items-center justify-center text-5xl">❌</div>}
                            </>
                          ) : (
                            <div className="h-full flex items-center justify-center text-slate-600 text-sm">En attente...</div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

            </main>
          )}

          {/* MODE SMARTPHONE */}
          {viewMode === 'mobile' && (
            <main className="flex-1 flex flex-col p-4 max-w-md mx-auto w-full gap-5">
              <div className="flex bg-slate-900 p-1.5 rounded-xl border border-slate-800">
                {teams.map(t => (
                  <button key={t.id} onClick={() => setActiveTeamId(t.id)} className={`flex-1 py-2 text-xs font-bold rounded-lg ${activeTeamId === t.id ? `${t.color} text-white` : 'text-slate-400'}`}>
                    {t.name}
                  </button>
                ))}
              </div>

              {(() => {
                const t = teams.find(team => team.id === activeTeamId);
                if (!t) return null;
                return (
                  <div className="flex-1 flex flex-col justify-between gap-4">
                    <div className="grid grid-cols-2 gap-3">
                      {t.hand.map((card, idx) => {
                        const isSelected = t.selectedCard?.text === card.text;
                        return (
                          <div key={idx} onClick={() => handleSelectCard(t.id, card)} className={`p-3 rounded-xl border-2 h-28 flex flex-col justify-between cursor-pointer ${isSelected ? 'bg-amber-950/40 border-amber-400' : 'bg-slate-900 border-slate-800'}`}>
                            <p className="text-xs text-slate-200">{card.text}</p>
                            {isSelected && <span className="text-right text-amber-400 text-xs font-bold">Sélectionnée ✓</span>}
                          </div>
                        );
                      })}
                    </div>

                    <div className="grid grid-cols-3 gap-2">
                      {t.powers.map(p => (
                        <div key={p.id} className="flex flex-col gap-1">
                          <div onClick={() => setSelectedPowerForInfo(p)} className={`p-2 rounded-xl border h-20 flex flex-col justify-between cursor-pointer ${p.used ? 'bg-slate-900 border-slate-800 text-slate-600 opacity-40' : 'bg-amber-400 text-amber-950 border-amber-300 font-bold'}`}>
                            <span className="text-[10px] uppercase">Pouvoir</span>
                            <span className="text-xs">{p.name}</span>
                          </div>
                          <button disabled={p.used} onClick={() => setPowerToConfirm({ teamId: t.id, powerId: p.id })} className={`py-1 text-[11px] font-bold rounded-lg ${p.used ? 'bg-slate-900 text-slate-600' : 'bg-indigo-600 text-white'}`}>
                            {p.used ? 'Utilisé' : 'Utiliser'}
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })()}
            </main>
          )}

          {/* MODALES */}
          {selectedPowerForInfo && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full">
                <h3 className="text-lg font-bold text-amber-400 mb-2">{selectedPowerForInfo.name}</h3>
                <p className="text-sm text-slate-300 mb-6">{selectedPowerForInfo.desc}</p>
                <button onClick={() => setSelectedPowerForInfo(null)} className="w-full py-2 bg-slate-800 text-white font-bold rounded-xl">Fermer</button>
              </div>
            </div>
          )}

          {powerToConfirm && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full">
                <h3 className="text-lg font-bold text-white mb-2">Confirmer le pouvoir ?</h3>
                {powerToConfirm.powerId === 'p200' && (
                  <div className="grid grid-cols-2 gap-2 mb-4">
                    <button onClick={() => setPowerToConfirm(prev => ({ ...prev, option: 'plus200' }))} className={`py-2 text-xs font-bold rounded-lg border ${powerToConfirm.option === 'plus200' ? 'bg-amber-400 text-amber-950' : 'bg-slate-800 text-slate-300'}`}>+200</button>
                    <button onClick={() => setPowerToConfirm(prev => ({ ...prev, option: 'minus200' }))} className={`py-2 text-xs font-bold rounded-lg border ${powerToConfirm.option === 'minus200' ? 'bg-amber-400 text-amber-950' : 'bg-slate-800 text-slate-300'}`}>-200</button>
                  </div>
                )}
                <div className="flex gap-2">
                  <button onClick={() => setPowerToConfirm(null)} className="flex-1 py-2 bg-slate-800 text-slate-300 font-bold rounded-xl">Annuler</button>
                  <button onClick={confirmUsePower} className="flex-1 py-2 bg-indigo-600 text-white font-bold rounded-xl">Valider</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
