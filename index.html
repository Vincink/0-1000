<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>0 à 1000</title>

  <!-- Bibliothèque officielle pour générer le QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    @font-face {
      font-family: 'BalloonDreams';
      src: url('assets/fonts/BALLOON_DREAMS.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'MontserratCustom';
      src: url('assets/fonts/montserrat-cyrillic-500-normal.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #020617;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'MontserratCustom', sans-serif;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .team-title {
      font-family: 'MontserratCustom', sans-serif;
      font-weight: 700;
      font-size: 98px;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .cards-count {
      font-family: 'MontserratCustom', sans-serif;
      font-weight: 700;
      font-size: 92px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .target-number {
      font-family: 'BalloonDreams', sans-serif;
      font-size: 320px;
      fill: #ffffff;
      stroke: #1e1b4b;
      stroke-width: 14px;
      paint-order: stroke fill;
      text-anchor: middle;
      dominant-baseline: central;
    }

    /* FENÊTRE MODALE QR CODE AU PREMIER LANCEMENT */
    .qr-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .qr-modal {
      background-color: #0f172a;
      border: 6px solid #fbbf24;
      border-radius: 32px;
      padding: 40px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
      max-width: 90vw;
    }

    .qr-modal h2 {
      color: #fbbf24;
      font-size: 36px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .qr-box {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-modal p {
      color: #e2e8f0;
      font-size: 20px;
      max-width: 420px;
      line-height: 1.4;
    }

    .start-btn {
      background-color: #fbbf24;
      color: #020617;
      border: none;
      border-radius: 16px;
      padding: 18px 44px;
      font-family: 'MontserratCustom', sans-serif;
      font-size: 26px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .start-btn:hover {
      background-color: #fcd34d;
      transform: scale(1.04);
    }

    .start-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <!-- PLATEAU TV 4K (STRICTEMENT INCHANGÉ) -->
  <svg viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid meet">
    <image href="assets/Fond.jpg" x="0" y="0" width="3840" height="2160" />
    <text x="665" y="382" class="team-title">Équipe Bleue</text>
    <text x="665" y="685" class="cards-count">6 cartes</text>
    <text x="1920" y="1080" class="target-number">500</text>
    <text x="3175" y="382" class="team-title">Équipe Rouge</text>
    <text x="3175" y="685" class="cards-count">6 cartes</text>
  </svg>

  <!-- FENÊTRE SUPERPOSÉE AU PREMIER LANCEMENT -->
  <div id="qr-overlay" class="qr-overlay">
    <div class="qr-modal">
      <h2>Rejoindre la partie</h2>
      <div class="qr-box">
        <div id="qrcode"></div>
      </div>
      <p>Scannez ce QR Code avec vos smartphones pour choisir votre équipe</p>
      <button id="start-btn" class="start-btn">LANCER LA PARTIE</button>
    </div>
  </div>

  <script>
    // Génère l'URL mobile à partir de l'adresse actuelle de la page
    const mobileUrl = new URL(window.location.href);
    mobileUrl.searchParams.set('mode', 'mobile');

    // Création du QR Code
    new QRCode(document.getElementById('qrcode'), {
      text: mobileUrl.toString(),
      width: 240,
      height: 240,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    // Fermeture de la fenêtre QR Code au clic sur le bouton
    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('qr-overlay').style.display = 'none';
    });
  </script>

</body>
</html>
