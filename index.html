<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>0 à 1000</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @font-face {
      font-family: 'BalloonDreams';
      src: url('assets/fonts/BALLOON_DREAMS.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'MontserratCustom';
      src: url('assets/fonts/montserrat-cyrillic-500-normal.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    body {
      font-family: 'MontserratCustom', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
    }

    .cartoon-number {
      font-family: 'BalloonDreams', sans-serif;
      color: #ffffff;
      -webkit-text-stroke: 4px #1e1b4b;
    }
  </style>
</head>
<body class="w-screen h-screen relative bg-slate-950">

  <!-- FOND D'ÉCRAN PRINCIPAL (CONTIENT DÉJÀ TOUS LES CADRES ET VISUELS) -->
  <img 
    src="assets/Fond.jpg" 
    alt="Fond du plateau" 
    class="absolute inset-0 w-full h-full object-fill z-0"
  />

  <!-- CALQUE DES TEXTES UNIQUEMENT (POSITIONNÉS AU PIXEL PRÈS EN %) -->
  <div class="relative z-10 w-full h-full">

    <!-- NOM ÉQUIPE BLEUE (Dans le cartouche bleu en haut à gauche) -->
    <div class="absolute top-[15.5%] left-[3%] w-[29%] h-[6.5%] flex items-center justify-center">
      <span class="text-white font-bold text-3xl tracking-wide">Équipe Bleue</span>
    </div>

    <!-- COMPTEUR ÉQUIPE BLEUE (Dans le cartouche jaune à gauche) -->
    <div class="absolute top-[25.5%] left-[4.2%] w-[26.5%] h-[6%] flex items-center justify-center">
      <span class="text-black font-bold text-2xl">6 cartes</span>
    </div>

    <!-- CARTE CIBLE CENTRALE (Dans le cadre central du fond) -->
    <div class="absolute top-[34%] left-[35.5%] w-[29%] h-[33%] flex items-center justify-center">
      <span class="text-[7.5rem] leading-none cartoon-number">
        500
      </span>
    </div>

    <!-- NOM ÉQUIPE ROUGE (Dans le cartouche rouge en haut à droite) -->
    <div class="absolute top-[15.5%] right-[3%] w-[29%] h-[6.5%] flex items-center justify-center">
      <span class="text-white font-bold text-3xl tracking-wide">Équipe Rouge</span>
    </div>

    <!-- COMPTEUR ÉQUIPE ROUGE (Dans le cartouche jaune à droite) -->
    <div class="absolute top-[25.5%] right-[4.2%] w-[26.5%] h-[6%] flex items-center justify-center">
      <span class="text-black font-bold text-2xl">6 cartes</span>
    </div>

  </div>

</body>
</html>
