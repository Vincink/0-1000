<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>0 à 1000</title>

  <style>
    @font-face {
      font-family: 'BalloonDreams';
      src: url('assets/fonts/BALLOON_DREAMS.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'MontserratCustom';
      src: url('assets/fonts/montserrat-cyrillic-500-normal.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #020617;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Le SVG occupe tout l'écran en conservant exactement les proportions 3840x2160 */
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .team-title {
      font-family: 'MontserratCustom', sans-serif;
      font-weight: 700;
      font-size: 74px;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .cards-count {
      font-family: 'MontserratCustom', sans-serif;
      font-weight: 700;
      font-size: 68px;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .target-number {
      font-family: 'BalloonDreams', sans-serif;
      font-size: 320px;
      fill: #ffffff;
      stroke: #1e1b4b;
      stroke-width: 14px;
      paint-order: stroke fill;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>
<body>

  <!-- Scène verrouillée aux dimensions exactes 4K de Fond.jpg -->
  <svg viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid meet">
    
    <!-- Image de fond 4K -->
    <image href="assets/Fond.jpg" x="0" y="0" width="3840" height="2160" />

    <!-- ÉQUIPE BLEUE : Titre centré dans la pilule bleue -->
    <text x="675" y="408" class="team-title">Équipe Bleue</text>

    <!-- ÉQUIPE BLEUE : "6 cartes" centré dans la pilule jaune gauche -->
    <text x="675" y="662" class="cards-count">6 cartes</text>

    <!-- CARTE CIBLE CENTRALE : Chiffre "500" -->
    <text x="1920" y="1080" class="target-number">500</text>

    <!-- ÉQUIPE ROUGE : Titre centré dans la pilule rouge -->
    <text x="3165" y="408" class="team-title">Équipe Rouge</text>

    <!-- ÉQUIPE ROUGE : "6 cartes" centré dans la pilule jaune droite -->
    <text x="3165" y="662" class="cards-count">6 cartes</text>

  </svg>

</body>
</html>
